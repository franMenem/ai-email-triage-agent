name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      # The tests replace the Claude call with a fake: no real key is needed
      - run: uv run pytest
        env:
          ANTHROPIC_API_KEY: not-used-in-tests
